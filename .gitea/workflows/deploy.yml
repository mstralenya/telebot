name: Deploy Telebot Stack

on:
  push:
    branches:
      - master
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Compute semver: MAJOR.MINOR from VERSION file, PATCH = commits since it last changed.
      - name: Compute version
        id: ver
        run: |
          BASE="$(tr -d '[:space:]' < VERSION)"
          LAST="$(git rev-list -n1 HEAD -- VERSION || true)"
          if [ -n "$LAST" ]; then
            PATCH=$(git rev-list --count "${LAST}..HEAD")
          else
            PATCH=$(git rev-list --count HEAD)
          fi
          VERSION="${BASE}.${PATCH}"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "Computed version: ${VERSION}"

      - name: Build Docker Image
        run: |
          docker build \
            --build-arg APP_VERSION=${{ steps.ver.outputs.version }} \
            -t mstralenya/telebot:master \
            -t mstralenya/telebot:${{ steps.ver.outputs.version }} \
            .

      - name: Sync Stack Configuration and Deploy
        run: |
          mkdir -p /data/stacks/telebot
          cp deploy/compose.yaml /data/stacks/telebot/compose.yaml
          touch /data/stacks/telebot/.env
          grep -q "^WEBAPP_BASE_URL=" /data/stacks/telebot/.env || echo "WEBAPP_BASE_URL=https://telebot.foobar.cfd" >> /data/stacks/telebot/.env
          sed -i 's|^WEBAPP_BASE_URL=.*|WEBAPP_BASE_URL=https://telebot.foobar.cfd|' /data/stacks/telebot/.env
          cd /data/stacks/telebot
          docker compose -p telebot --env-file /data/stacks/telebot/.env up -d --force-recreate --remove-orphans
